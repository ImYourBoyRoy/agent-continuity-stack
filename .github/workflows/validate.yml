name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.14"

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Validate package
        run: python3 scripts/validate_bundle.py

      - name: Validate canonical contract
        run: python3 scripts/inspect_contract.py source

      - name: Inspect source tree
        run: >-
          python3 scripts/inspect_tree.py . --exclude .git --exclude .env
          --exclude MEMORY.md --exclude AGENTS.override.md
          --exclude CLAUDE.local.md --exclude .claude/settings.local.json

      - name: Run portable conformance tests
        run: python3 tests/run_portable_tests.py
